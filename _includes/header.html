<header class="site-header" id="site-header">
  <div class="nav-glass" data-stage data-transparent>
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      {% include logo.html %}
      <span>{{ site.title }}</span>
    </a>
    <nav class="nav-links" id="nav-links" aria-label="Primary">
      <span class="nav-bubble" aria-hidden="true" data-glass="clear" data-glass-rest="#ffffff1c" data-glass-ref="30" data-glass-blur="0.2" hidden></span>
      {%- for item in site.nav %}
      {%- assign here = false -%}
      {%- if item.href != '/' and page.url contains item.href -%}{%- assign here = true -%}{%- endif %}
      <a href="{{ item.href | relative_url }}" data-paint{% if here %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {%- endfor %}
    </nav>
    <div class="nav-right">
      <a class="nav-icon nav-gh" href="{{ site.social.github }}" target="_blank" rel="noopener" aria-label="Pvot on GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
      </a>
      <button class="nav-icon nav-menu" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
        <span class="ms">menu</span>
      </button>
    </div>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="nav-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage id="nav-refract-map" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="soft"/>
      <feDisplacementMap id="nav-refract-disp" in="soft" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
</header>
