<div class="controls">
  <button class="g-switch" role="switch" aria-checked="true" aria-label="Wi-Fi" data-lift-host>
    <span class="g-switch-track" data-paint="box"></span>
    <span class="g-switch-knob" data-glass="clear" data-glass-lift data-glass-rest="#ffffff"></span>
  </button>
  <div class="g-slider" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" data-lift-host>
    <span class="g-slider-track" data-paint="box"></span>
    <span class="g-slider-fill" data-paint="box"></span>
    <span class="g-slider-knob" data-glass="clear" data-glass-lift data-glass-rest="#ffffff"></span>
  </div>
  <div class="g-icons">
    <button class="g-icon" data-glass="clear" data-glass-press aria-label="Previous"><span class="ms fill">skip_previous</span></button>
    <button class="g-icon" data-glass="clear" data-glass-press aria-label="Play" data-toggle-icon="play_arrow pause"><span class="ms fill">play_arrow</span></button>
    <button class="g-icon" data-glass="clear" data-glass-press aria-label="Next"><span class="ms fill">skip_next</span></button>
  </div>
  <button class="g-switch" role="switch" aria-checked="false" aria-label="Airplane mode" data-lift-host>
    <span class="g-switch-track" data-paint="box"></span>
    <span class="g-switch-knob" data-glass="clear" data-glass-lift data-glass-rest="#ffffff"></span>
  </button>
</div>
